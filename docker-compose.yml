version: '3.8'

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: leilao-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-leilao_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leilao_password}
      POSTGRES_DB: ${DB_NAME:-leilao_imoveis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leilao_user} -d ${DB_NAME:-leilao_imoveis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leilao-network

  # ==========================================================================
  # Backend API
  # ==========================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leilao-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-leilao_user}:${DB_PASSWORD:-leilao_password}@postgres:5432/${DB_NAME:-leilao_imoveis}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-https://seusite.com.br}
      SITE_URL: ${SITE_URL:-https://seusite.com.br}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    volumes:
      - uploads_data:/app/backend/uploads
      - ./logs:/app/logs
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - leilao-network

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: leilao-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - uploads_data:/usr/share/nginx/uploads:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - leilao-network

  # ==========================================================================
  # Certbot for SSL (optional)
  # ==========================================================================
  certbot:
    image: certbot/certbot
    container_name: leilao-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - leilao-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  leilao-network:
    driver: bridge
